name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 왜 잡이 여러 개인가 ──────────────────────────────────────────
  #
  # 예전에는 한 잡에서 빌드하고 E2E 두 모드를 차례로 돌렸습니다. 20 분이
  # 걸렸고, 그 중 17 분이 E2E 였습니다. 원인은 **worker 가 1 개** 였다는
  # 것입니다 — 이 저장소는 private 이라 `ubuntu-latest` 가 2 코어이고,
  # Playwright 의 기본 worker 수는 `코어수/2` 라서 정확히 1 이 됩니다.
  #
  # 러너 안에서 worker 를 늘려도 2 코어가 천장입니다. 그래서 **러너 자체를
  # 늘립니다** — 샤드마다 별도 잡이 붙어 각자 2 코어를 씁니다.
  #
  # 안전한가: 로컬은 이미 8 worker 로 같은 D1 하나를 두들기며 전부
  # 통과합니다. 병렬 실행 자체는 검증돼 있습니다.

  build-gate:
    name: 빌드 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # 폰트 서브셋 검사가 woff2 를 열려면 fontTools 와 brotli 가 둘 다 필요합니다.
      # 없으면 `check:fonts` 가 CI 에서 실패합니다 — 예전에는 조용히 건너뛰었고,
      # 그래서 이 검사는 배포 경로에서 한 번도 돈 적이 없었습니다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli

      - run: npm ci

      # E2E 도 webServer 안에서 빌드하지만, 거기서 깨지면 "서버가 안 떴다" 로만
      # 보입니다. 여기서 먼저 돌려 토큰·번역 키·폰트·타입 중 무엇이 깨졌는지
      # 이름으로 알려줍니다.
      - name: 빌드
        run: npm run build

  e2e:
    name: E2E ${{ matrix.mode }} ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # 한 샤드가 깨져도 나머지를 끝까지 돌립니다. 하나 고치고 다시 밀었더니
      # 다음 게 깨지는 왕복을 없앱니다.
      fail-fast: false
      matrix:
        # ── 왜 프로젝트까지 갈라 놓았는가 ────────────────────────────
        #
        # `fullyParallel` 이라 샤딩은 테스트 **단위** 로 이뤄지지만, 균형은
        # **개수** 로만 맞춥니다. Playwright 가 프로젝트 순으로 정렬한 뒤
        # 반으로 자르니, launch 2 샤드가 경계에 딱 맞아떨어졌습니다:
        #
        #   샤드 1/2  mobile  347 개 → 288 초
        #   샤드 2/2  desktop 347 개 → 140 초
        #
        # 개수는 같은데 시간은 2 배입니다. 리눅스에서 WebKit 이 Chromium 보다
        # 그만큼 느립니다. 느린 쪽이 통째로 한 샤드에 몰려 벽시계를 잡았습니다.
        #
        # 그래서 프로젝트를 먼저 가르고, 느린 mobile 에 샤드를 더 줍니다.
        # 덤으로 잡마다 브라우저를 하나만 깔면 됩니다 — 예전에는 webkit 과
        # chromium 의 apt 의존성 182 개를 샤드마다 함께 깔았습니다.
        include:
          - { mode: commerce, project: mobile, browser: webkit, shard: 1, total: 3 }
          - { mode: commerce, project: mobile, browser: webkit, shard: 2, total: 3 }
          - { mode: commerce, project: mobile, browser: webkit, shard: 3, total: 3 }
          - { mode: commerce, project: desktop, browser: chromium, shard: 1, total: 2 }
          - { mode: commerce, project: desktop, browser: chromium, shard: 2, total: 2 }
          - { mode: launch, project: mobile, browser: webkit, shard: 1, total: 2 }
          - { mode: launch, project: mobile, browser: webkit, shard: 2, total: 2 }
          - { mode: launch, project: desktop, browser: chromium, shard: 1, total: 1 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # 폰트 서브셋 검사가 woff2 를 열려면 fontTools 와 brotli 가 둘 다 필요합니다.
      # 없으면 `check:fonts` 가 CI 에서 실패합니다 — 예전에는 조용히 건너뛰었고,
      # 그래서 이 검사는 배포 경로에서 한 번도 돈 적이 없었습니다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli

      - run: npm ci

      # 잡마다 자기 프로젝트가 쓰는 브라우저 하나만 받습니다. 캐시는 같은
      # 브라우저를 쓰는 잡들끼리 공유합니다.
      - name: 브라우저 캐시
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright 브라우저 설치
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # 캐시에는 브라우저만 담깁니다. OS 패키지는 apt 로 들어가므로
      # 캐시가 맞았어도 이건 따로 깔아야 브라우저가 뜹니다.
      - name: 브라우저 OS 의존성
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: E2E 테스트
        env:
          E2E_MODE: ${{ matrix.mode }}
          E2E_SHARD: ${{ matrix.project }}-${{ matrix.shard }}
        run: >-
          npx playwright test
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: blob 리포트 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ matrix.mode }}-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # 샤드가 나뉘면 리포트도 나뉩니다. 실패했을 때만 합쳐서 하나로 봅니다 —
  # 통과한 실행의 리포트는 아무도 열지 않습니다.
  merge-reports:
    name: 테스트 리포트 병합
    needs: [e2e]
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-*
          merge-multiple: true

      - run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Cloudflare Workers 배포
    needs: [build-gate, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # 폰트 서브셋 검사가 woff2 를 열려면 fontTools 와 brotli 가 둘 다 필요합니다.
      # 없으면 `check:fonts` 가 CI 에서 실패합니다 — 예전에는 조용히 건너뛰었고,
      # 그래서 이 검사는 배포 경로에서 한 번도 돈 적이 없었습니다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli

      - run: npm ci

      # D1 데이터베이스를 아직 만들지 않았으면 wrangler 가 알아보기 어려운 오류를 냅니다.
      # 여기서 먼저 걸러 무엇을 해야 하는지 알려줍니다.
      - name: 배포 전 설정 점검
        run: |
          if grep -q 'PLACEHOLDER_RUN_WRANGLER_D1_CREATE' wrangler.jsonc; then
            echo "::error::D1 데이터베이스가 아직 만들어지지 않았습니다."
            echo "  npx wrangler d1 create avora-orders"
            echo "  → 출력된 database_id 를 wrangler.jsonc 에 넣고"
            echo "  npm run db:migrate 로 테이블을 만든 뒤 다시 푸시하세요."
            exit 1
          fi

          # 테스트 전용 설정이 운영 설정에 섞여 들어가면 안 됩니다.
          # ADMIN_DEV_TOKEN 은 Cloudflare Access 를 우회하는 열쇠고,
          # mock 결제 어댑터는 돈을 받지 않고 승인된 척합니다.
          # NOTIFY_WEBHOOK_URL 은 그 자체가 발송 권한이라 secret 으로만 넣습니다.
          # wrangler.jsonc 는 저장소에 그대로 올라가므로 여기 적히면 URL 이 공개됩니다.
          # RATE_LIMIT_BYPASS 는 공개 쓰기의 속도 제한을 지나가는 열쇠입니다.
          for leaked in ADMIN_DEV_TOKEN PRODUCT_PRICE NOTIFY_WEBHOOK_URL RATE_LIMIT_BYPASS; do
            if grep -q "\"$leaked\"" wrangler.jsonc; then
              echo "::error::$leaked 는 테스트 전용입니다. wrangler.jsonc 에서 지우세요."
              exit 1
            fi
          done
          if grep -q '"PAYMENT_PROVIDER"[[:space:]]*:[[:space:]]*"mock"' wrangler.jsonc; then
            echo "::error::mock 결제 어댑터는 실제 결제를 받지 않습니다. 운영 설정에 두면 안 됩니다."
            exit 1
          fi
          # 목록으로도 쓸 수 있어(mock,mock2) 정확히 "mock" 만 보면 새어 나갑니다.
          if grep -qE '"AUTH_PROVIDER"[[:space:]]*:[[:space:]]*"[^"]*mock' wrangler.jsonc; then
            echo "::error::mock 로그인 제공자는 아무나 아무 계정으로 로그인시킵니다. 운영 설정에 두면 안 됩니다."
            exit 1
          fi

          # 관리 화면은 자물쇠가 둘입니다 — Cloudflare Access 정책(대시보드)과
          # 허용 목록(여기). 정책은 저장소 밖에 있어 누가 넓혀도 diff 에 남지
          # 않으므로, 목록 쪽이 비면 그 순간 정책 하나만 남습니다.
          if grep -q '"ACCESS_TEAM_DOMAIN"[[:space:]]*:[[:space:]]*"[^"]' wrangler.jsonc; then
            allowed=$(sed -n 's/.*"ADMIN_ALLOWED_EMAILS"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' wrangler.jsonc)
            if ! printf '%s' "$allowed" | grep -q '@'; then
              echo "::error::ADMIN_ALLOWED_EMAILS 가 비어 있습니다. 관리 화면이 아무에게도 열리지 않습니다."
              echo "  wrangler.jsonc 의 vars 에 관리자 이메일을 쉼표로 구분해 넣으세요."
              exit 1
            fi
            # "@gmail.com" 처럼 도메인만 적으면 그 도메인 전체가 관리자가 됩니다.
            if printf '%s' "$allowed" | tr ',' '\n' | grep -qE '(^|[[:space:]])@'; then
              echo "::error::ADMIN_ALLOWED_EMAILS 에 도메인만 적힌 항목이 있습니다: $allowed"
              echo "  목록은 사람 단위여야 합니다. 도메인 전체를 넣으면 문이 열린 것과 같습니다."
              exit 1
            fi
          fi

      # ── 운영 D1 이 마이그레이션보다 뒤처져 있으면 배포를 멈춥니다 ──
      #
      # 이 저장소에는 운영 마이그레이션을 자동으로 거는 단계가 없습니다.
      # `npm run db:migrate` 를 사람이 손으로 돌립니다. 그 자체는 의도된
      # 것입니다 — 마이그레이션은 되돌리기 어렵고, 배포마다 자동으로 걸면
      # 잘못된 스키마 변경이 아무도 안 볼 때 운영에 들어갑니다.
      #
      # 문제는 **잊었을 때 아무도 말해 주지 않는다** 는 것이었습니다.
      # 새 표를 쓰는 코드가 먼저 배포되면 그 기능은 운영에서만 500 을 냅니다.
      # 테스트는 로컬 D1 을 쓰므로 전부 초록입니다.
      #
      # 그래서 여기서는 **적용하지 않고 확인만** 합니다. 뒤처져 있으면
      # 배포를 멈추고, 사람이 `npm run db:migrate` 를 돌린 뒤 다시 돌립니다.
      - name: 운영 D1 마이그레이션 확인
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx wrangler d1 migrations list avora-orders --remote 2>&1) || {
            echo "$out"
            echo "::error::운영 D1 상태를 읽지 못했습니다. 위 출력을 확인하세요."
            exit 1
          }
          echo "$out"
          if printf '%s' "$out" | grep -q 'No migrations to apply'; then
            echo "운영 D1 이 migrations/ 와 같습니다."
            exit 0
          fi
          echo "::error::운영 D1 에 적용되지 않은 마이그레이션이 있습니다."
          echo "  npm run db:migrate 를 돌린 뒤 이 워크플로를 다시 실행하세요."
          echo "  (자동으로 걸지 않는 이유: 마이그레이션은 되돌리기 어렵습니다)"
          exit 1

      - run: npm run build

      - name: 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

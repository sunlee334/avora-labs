name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 빌드가 토큰 생성·번역 키 검사·폰트 서브셋 검사를 함께 수행합니다.
      - name: 빌드
        run: npm run build

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps webkit chromium

      # 사이트는 두 모드로 동작합니다. 한 쪽만 돌리면 나머지는 아무도 확인하지 않은 채 나갑니다.
      - name: E2E 테스트 — commerce (2차 자사 결제)
        run: npm run test:e2e

      - name: E2E 테스트 — launch (1차 외부몰)
        run: npm run test:e2e:launch

      - name: 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Cloudflare Workers 배포
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # D1 데이터베이스를 아직 만들지 않았으면 wrangler 가 알아보기 어려운 오류를 냅니다.
      # 여기서 먼저 걸러 무엇을 해야 하는지 알려줍니다.
      - name: 배포 전 설정 점검
        run: |
          if grep -q 'PLACEHOLDER_RUN_WRANGLER_D1_CREATE' wrangler.jsonc; then
            echo "::error::D1 데이터베이스가 아직 만들어지지 않았습니다."
            echo "  npx wrangler d1 create avora-orders"
            echo "  → 출력된 database_id 를 wrangler.jsonc 에 넣고"
            echo "  npm run db:migrate 로 테이블을 만든 뒤 다시 푸시하세요."
            exit 1
          fi

          # 테스트 전용 설정이 운영 설정에 섞여 들어가면 안 됩니다.
          # ADMIN_DEV_TOKEN 은 Cloudflare Access 를 우회하는 열쇠고,
          # mock 결제 어댑터는 돈을 받지 않고 승인된 척합니다.
          # NOTIFY_WEBHOOK_URL 은 그 자체가 발송 권한이라 secret 으로만 넣습니다.
          # wrangler.jsonc 는 저장소에 그대로 올라가므로 여기 적히면 URL 이 공개됩니다.
          for leaked in ADMIN_DEV_TOKEN PRODUCT_PRICE NOTIFY_WEBHOOK_URL; do
            if grep -q "\"$leaked\"" wrangler.jsonc; then
              echo "::error::$leaked 는 테스트 전용입니다. wrangler.jsonc 에서 지우세요."
              exit 1
            fi
          done
          if grep -q '"PAYMENT_PROVIDER"[[:space:]]*:[[:space:]]*"mock"' wrangler.jsonc; then
            echo "::error::mock 결제 어댑터는 실제 결제를 받지 않습니다. 운영 설정에 두면 안 됩니다."
            exit 1
          fi

      - run: npm run build

      - name: 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="paros-deodorant-title">
  <title id="paros-deodorant-title">PAROS Deodorant 스틱 (개발 예정)</title>
  <defs>
    <linearGradient id="stickBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfdfe8" />
      <stop offset="0.6" stop-color="#afc8d8" />
      <stop offset="1" stop-color="#8fb0c6" />
    </linearGradient>
    <linearGradient id="stickBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb0c6" />
      <stop offset="1" stop-color="#567a93" />
    </linearGradient>
  </defs>

  <ellipse cx="180" cy="486" rx="86" ry="14" fill="#1e2124" opacity="0.06" />

  <rect x="126" y="60" width="108" height="180" rx="14" fill="url(#stickBody)" />
  <rect x="126" y="212" width="108" height="28" fill="#9ab6c9" />

  <rect x="118" y="240" width="124" height="220" rx="20" fill="url(#stickBase)" />
  <rect x="118" y="252" width="124" height="10" fill="#1e2124" opacity="0.1" />
  <rect x="118" y="440" width="124" height="10" fill="#1e2124" opacity="0.1" />

  <text x="180" y="150" text-anchor="middle" font-family="'Pretendard Variable', Pretendard, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#2b2f34">PAROS</text>

  <text x="180" y="360" text-anchor="middle" font-family="'Pretendard Variable', Pretendard, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#f1f6f9">DEODORANT</text>
</svg>
